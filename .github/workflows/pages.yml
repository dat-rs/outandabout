# Builds the site with the repo's own Gemfile and deploys it to GitHub
# Pages - the same setup as soldesignarchive, whose Pages "legacy"
# builder (the github-pages gem, pinned to Jekyll 3.10) could not
# resolve a Jekyll 4 Gemfile.
#
# Requires Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions".

name: Build and deploy the site

on:
  push:
    branches: [main]
  # So a failed deploy can be re-run without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never deploy two builds at once, but don't cancel one in flight - a
# half-deployed site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Photos are stored in Git LFS (see .gitattributes); without
          # this the build publishes the pointer files instead.
          lfs: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1.3"
          bundler-cache: true

      - uses: actions/configure-pages@v5

      - run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
