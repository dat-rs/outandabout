<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <meta name="author" content="Ricardo Santos" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#ebe9e4" />
    <meta name="apple-mobile-web-app-title" content="{{ site.title }}" />
    <meta name="application-name" content="{{ site.title }}" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
      crossorigin="anonymous" />

    <!-- Adobe Fonts kit shared with soldesignarchive (degular-mono). It only
         serves domains listed on the kit, so add this site's domain there. -->
    <link rel="stylesheet" href="https://use.typekit.net/tjk6djf.css" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/carousel/carousel.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.css" />

    <link rel="stylesheet" href="/css/style.css" />

    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="/feed/artefacts.xml" />

    <title>{{ include.page-meta-title }}</title>

    <!-- Primary Meta Tags -->
    <meta name="title" content="{{ include.page-meta-title }}" />
    <meta name="description" content="{{ include.page-meta-description }}" />

    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="{{ include.page-meta-title }}" />
    <meta property="og:description" content="{{ include.page-meta-description }}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ site.url }}{{ include.page-meta-url }}" />
    {%- if include.page-meta-image %}
    <meta property="og:image" content="{{ site.url }}{{ include.page-meta-image }}" />
    {%- endif %}
    <meta property="og:site_name" content="{{ site.title }}" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="{{ site.url }}{{ include.page-meta-url }}" />
    <meta property="twitter:title" content="{{ include.page-meta-title }}" />
    <meta property="twitter:description" content="{{ include.page-meta-description }}" />
    {%- if include.page-meta-image %}
    <meta property="twitter:image" content="{{ site.url }}{{ include.page-meta-image }}" />
    {%- endif %}
  </head>

  <body class="{{ include.body-class }}">
    <header class="container-fluid container-header">
      <div class="row header-row">
        <div class="col-auto col-md-3 col-lg-2 title-col">
          <h1 class="site-title"><a href="/">{{ site.title }}</a></h1>
        </div>

        {% include nav.html current=include.current %}
      </div>
    </header>
